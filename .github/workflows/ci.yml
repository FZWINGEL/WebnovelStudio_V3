name: V3 editor contracts and Windows spike
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.impeccable/**'
      - 'README.md'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.impeccable/**'
      - 'README.md'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      native_layout:
        description: Native scheduling (serial is available for comparison)
        type: choice
        options: [serial, fanout]
        default: fanout
      cargo_network:
        description: Compare normal registry access with prepared frozen Cargo commands
        type: choice
        options: [locked, prepared-frozen]
        default: prepared-frozen
concurrency:
  group: v3-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_NETWORK_FLAG: ${{ inputs.cargo_network != 'locked' && '--frozen' || '--locked' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check product versions and release guard
        run: node --test scripts/runner-identities.test.mjs scripts/collect-ci-timings.test.mjs scripts/native-artifact.test.mjs scripts/native-consumer.test.mjs scripts/owned-process.test.mjs scripts/check-versions.test.mjs scripts/prepare-package-retest.test.mjs
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: v3-core-contract-ubuntu-latest-rust-1.98.1
          cache-on-failure: true
          cache-bin: false
      - name: Prepare locked dependencies only when missing
        if: inputs.cargo_network != 'locked'
        run: node scripts/prepare-cargo.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy -p webnovel-core --all-targets ${{ env.CARGO_NETWORK_FLAG }} --timings -- -D warnings
      - run: cargo test -p webnovel-core ${{ env.CARGO_NETWORK_FLAG }} --timings
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-timings-ubuntu
          path: |
            target/cargo-timings/
            .local/performance/
          include-hidden-files: true
  windows-native:
    runs-on: windows-latest
    # A cold dependency build and cache upload exceeded 25 minutes even with
    # every test passing. Keep the test harness timeouts independently bounded.
    timeout-minutes: 35
    env:
      # Keep line information for failures; CI does not need local variable/type
      # debug data. Assertions and the Tauri development surface stay enabled.
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check product versions and release guard
        run: node --test scripts/runner-identities.test.mjs scripts/collect-ci-timings.test.mjs scripts/native-artifact.test.mjs scripts/native-consumer.test.mjs scripts/owned-process.test.mjs scripts/check-versions.test.mjs scripts/prepare-package-retest.test.mjs
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: v3-native-${{ runner.os }}-rust-1.98.1
          cache-on-failure: true
          cache-bin: false
      - run: npm ci
        working-directory: apps/desktop
      # Windows Rust contracts run once below as part of the complete workspace.
      # Retain the Windows frontend gate here instead of duplicating the job.
      - run: npm test
        working-directory: apps/desktop
      - name: Prepare locked dependencies only when missing
        if: inputs.cargo_network != 'locked'
        run: node scripts/prepare-cargo.mjs
      - run: cargo clippy --workspace --all-targets ${{ env.CARGO_NETWORK_FLAG }} --timings -- -D warnings
      - run: cargo test --workspace ${{ env.CARGO_NETWORK_FLAG }} --timings
      - run: npm run desktop:spike -- -- ${{ env.CARGO_NETWORK_FLAG }} --timings
        working-directory: apps/desktop
      - name: Prepare exact native executable artifact
        if: inputs.native_layout != 'serial'
        run: node scripts/native-artifact.mjs create .local/native-app
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.native_layout != 'serial'
        with:
          name: native-app-${{ github.run_attempt }}
          path: .local/native-app/
          include-hidden-files: true
          if-no-files-found: error
      # Qualify the short Workshop path before the broader editor regressions
      # so a Workshop failure does not wait for the full native editor flow.
      - run: npm run test:native-workshop
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/workshop.events.jsonl
        working-directory: apps/desktop
      - run: npm run test:native
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/main.events.jsonl
        working-directory: apps/desktop
      - run: npm run test:native-http
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/http.events.jsonl
        working-directory: apps/desktop
      - run: npm run test:native-close
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/close.events.jsonl
        working-directory: apps/desktop
      - run: npm run test:native-interruption
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/interruption.events.jsonl
        working-directory: apps/desktop
      - run: npm run test:native-recovery
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/recovery.events.jsonl
        working-directory: apps/desktop
      - run: npm run test:native-memory-lookup
        if: inputs.native_layout == 'serial'
        env:
          WNS_V3_NATIVE_TRACE: ${{ github.workspace }}/.local/native-results/memory.events.jsonl
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-spike-evidence
          path: .local/native-results/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-timings-windows
          path: |
            target/cargo-timings/
            .local/performance/
          include-hidden-files: true
  native-consumer:
    if: inputs.native_layout != 'serial'
    needs: windows-native
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        consumer: [main, lifecycle]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-app-${{ github.run_attempt }}
          path: .local/native-app
      - name: Verify artifact and execute expected suites
        run: node scripts/native-consumer.mjs ${{ matrix.consumer }} .local/native-app
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-evidence-${{ matrix.consumer }}-${{ github.run_attempt }}
          path: .local/native-results/
          include-hidden-files: true
          if-no-files-found: error
  native-gate:
    if: always() && inputs.native_layout != 'serial'
    needs: [windows-native, native-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Require producer and every consumer
        env:
          PRODUCER: ${{ needs.windows-native.result }}
          CONSUMERS: ${{ needs.native-consumer.result }}
        run: test "$PRODUCER" = success && test "$CONSUMERS" = success
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-evidence-*-${{ github.run_attempt }}
          path: .local/native-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-app-${{ github.run_attempt }}
          path: .local/native-app
      - name: Reconcile exact native checks and cleanup
        run: node scripts/native-consumer.mjs aggregate .local/native-evidence .local/native-app

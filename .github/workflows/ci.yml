name: V3 editor contracts and Windows spike
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.impeccable/**'
      - 'README.md'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.impeccable/**'
      - 'README.md'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      native_layout:
        description: Native scheduling (serial is available for comparison)
        type: choice
        options: [serial, fanout]
        default: fanout
      cargo_network:
        description: Compare normal registry access with prepared frozen Cargo commands
        type: choice
        options: [locked, prepared-frozen]
        default: prepared-frozen
concurrency:
  group: v3-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_NETWORK_FLAG: ${{ inputs.cargo_network != 'locked' && '--frozen' || '--locked' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check product versions and release guard
        run: node scripts/run-tooling-tests.mjs --profile=core
      - run: npm ci --prefer-offline --no-audit
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Lower dependency optimization in CI only
        # The manifest keeps opt-level=2 for dependencies so local debug runs
        # stay fast. On a cold CI cache, dependency codegen dominates; at 0 the
        # same crates compile much faster while debug assertions, overflow
        # checks, and the release profile are unchanged. Scoped to this
        # checkout's .cargo/config.toml; cargo resolves config files by walking
        # up from every invocation directory, so this also reaches the cargo
        # build spawned by the Tauri CLI.
        # Must run before rust-cache: .cargo/config.toml is part of the action's
        # hashed lockfile set, so the override gets its own cache entry instead
        # of colliding with an opt-level=2 one. skip-worktree keeps
        # `git status` clean for the native-artifact checkout-integrity gate
        # while leaving the appended content in place (and hashed).
        shell: bash
        run: |
          git update-index --skip-worktree .cargo/config.toml
          printf '\n[profile.dev.package."*"]\nopt-level = 0\n\n[profile.test.package."*"]\nopt-level = 0\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cache-on-failure must stay off: GitHub cache entries are immutable,
          # so an entry written by a run that failed before building every
          # required variant full-matches forever and can never be republished.
          # Only a fully green producer may publish.
          # shared-key carries the cache generation (-g2 escaped the stale
          # check-only entry). Bump it when CI cargo configuration that is NOT
          # already hashed changes; .cargo/config.toml, every Cargo.toml,
          # Cargo.lock, and rust-toolchain.toml already feed the key, and
          # CARGO_*/RUST* environment variables do via the environment hash.
          shared-key: v3-core-contract-ubuntu-latest-rust-1.98.1-g2
          cache-on-failure: false
          cache-bin: false
      - name: Prepare locked dependencies only when missing
        if: inputs.cargo_network != 'locked'
        run: node scripts/prepare-cargo.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude webnovel-desktop --all-targets ${{ env.CARGO_NETWORK_FLAG }} --timings -- -D warnings
      - run: cargo test --workspace --exclude webnovel-desktop ${{ env.CARGO_NETWORK_FLAG }} --timings
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-timings-ubuntu-${{ github.run_attempt }}
          path: |
            target/cargo-timings/
            .local/performance/
          include-hidden-files: true
  windows-native:
    runs-on: windows-latest
    # A cold dependency build and cache upload exceeded 25 minutes even with
    # every test passing. Keep the test harness timeouts independently bounded.
    timeout-minutes: 35
    env:
      # Keep line information for failures; CI does not need local variable/type
      # debug data. Assertions and the Tauri development surface stay enabled.
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disable Windows Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install native harness dependencies
        working-directory: tests/native
        run: npm ci --prefer-offline --no-audit
      - name: Check product versions, tooling, and native preflight
        run: node scripts/run-tooling-tests.mjs --profile=all
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Lower dependency optimization in CI only
        # Same override as contracts; see that step for the rationale and the
        # ordering requirement relative to rust-cache. skip-worktree keeps
        # `git status` clean for the native-artifact checkout-integrity gate.
        shell: bash
        run: |
          git update-index --skip-worktree .cargo/config.toml
          printf '\n[profile.dev.package."*"]\nopt-level = 0\n\n[profile.test.package."*"]\nopt-level = 0\n' >> .cargo/config.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # See the contracts job above: immutable entries + cache-on-failure
          # pinned a partial check-level cache that exact-matched on every run.
          shared-key: v3-native-${{ runner.os }}-rust-1.98.1-g2
          cache-on-failure: false
          cache-bin: false
      - run: npm ci --prefer-offline --no-audit
        working-directory: apps/desktop
      - name: Prepare locked dependencies only when missing
        if: inputs.cargo_network != 'locked'
        run: node scripts/prepare-cargo.mjs
      - run: cargo clippy --workspace --all-targets ${{ env.CARGO_NETWORK_FLAG }} --timings -- -D warnings
      - run: cargo test --workspace ${{ env.CARGO_NETWORK_FLAG }} --timings
      # tauri build enables the `custom-protocol` feature, so the spike
      # legitimately compiles a second dependency variant set; the producer
      # cache holds both instead of unifying them.
      - run: npm run desktop:spike -- -- ${{ env.CARGO_NETWORK_FLAG }} --timings
        working-directory: apps/desktop
      - name: Prepare exact native executable artifact
        run: node scripts/native-artifact.mjs create .local/native-app
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.native_layout != 'serial'
        with:
          name: native-app
          path: .local/native-app/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - name: Execute serial native suites
        if: inputs.native_layout == 'serial'
        run: node scripts/native-consumer.mjs serial .local/native-app
      - name: Reconcile serial native evidence
        if: inputs.native_layout == 'serial'
        run: node scripts/native-consumer.mjs aggregate .local/native-results .local/native-app serial
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-spike-evidence-${{ github.run_attempt }}
          path: .local/native-results/
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-timings-windows-${{ github.run_attempt }}
          path: |
            target/cargo-timings/
            .local/performance/
          include-hidden-files: true
  native-consumer:
    if: inputs.native_layout != 'serial'
    needs: windows-native
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        consumer: [main, lifecycle]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disable Windows Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/native/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: tests/native
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-app
          path: .local/native-app
      - name: Verify artifact and execute expected suites
        run: node scripts/native-consumer.mjs ${{ matrix.consumer }} .local/native-app
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-evidence-${{ matrix.consumer }}
          path: .local/native-results/consumer-${{ matrix.consumer }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-diagnostics-${{ matrix.consumer }}-${{ github.run_attempt }}
          path: .local/native-results/
          include-hidden-files: true
          if-no-files-found: warn

  native-gate:
    if: always() && inputs.native_layout != 'serial'
    needs: [windows-native, native-consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Require producer and every consumer
        env:
          PRODUCER: ${{ needs.windows-native.result }}
          CONSUMERS: ${{ needs.native-consumer.result }}
        run: test "$PRODUCER" = success && test "$CONSUMERS" = success
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-evidence-*
          path: .local/native-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-app
          path: .local/native-app
      - name: Reconcile exact native checks and cleanup
        run: node scripts/native-consumer.mjs aggregate .local/native-evidence .local/native-app

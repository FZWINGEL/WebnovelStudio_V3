[workspace]
members = [
    # L0 — foundation
    "crates/kernel",
    # L1
    "crates/storage",
    "crates/documents",
    "crates/providers",
    # L2
    "crates/context",
    # L3
    "crates/story",
    # L4
    "crates/conversation",
    "crates/workshop",
    # L5
    "crates/transfer",
    "crates/library",
    # Not a layer: enforces the layering rule itself.
    "crates/architecture",
    # The crate under decomposition, plus the app shell.
    "crates/core",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[package]
name = "wns-conversation"
version.workspace = true
edition = "2024"
description = "L5: discussions, project chat, proposals, guidance and the adoption transaction."

[dependencies]
specta = "1.0.5"
wns-kernel = { path = "../kernel" }
wns-storage = { path = "../storage" }
wns-documents = { path = "../documents" }
wns-providers = { path = "../providers" }
wns-context = { path = "../context" }
wns-story = { path = "../story" }
# The authoring half reads and writes its own tables.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# `project_chat_output` mints ids for the blocks it materialises.
uuid = { version = "=1.26.0", features = ["v4"] }
# `project_chat::transfer` hashes backup manifests in non-test code.
sha2 = "=0.11.0"

[dev-dependencies]

[package]
name = "wns-library"
version.workspace = true
edition = "2024"
description = "L5: the project library index and app preferences (CAS on revision)."

[dependencies]
wns-kernel = { path = "../kernel" }
wns-storage = { path = "../storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# `v2_import` opens the legacy database read-only and hashes its own copies.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
sha2 = "=0.11.0"
uuid = { version = "=1.26.0", features = ["v4"] }

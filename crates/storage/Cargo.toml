[package]
name = "wns-storage"
version.workspace = true
edition = "2024"
description = "L1: SQLite open, durability configuration and the linear migration chain."

[dependencies]
specta = "1.0.5"
wns-kernel = { path = "../kernel" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "=1.26.0", features = ["v4"] }
# The typed row readers return and store the record vocabulary, so this crate
# needs the serialization those records are defined with.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package]
name = "wns-transfer"
version.workspace = true
edition = "2024"
description = "L5: backup, recover, duplicate, draft and reviewed export, V2 import, recovery copy."

[dependencies]
wns-kernel = { path = "../kernel" }
wns-storage = { path = "../storage" }
wns-documents = { path = "../documents" }
wns-context = { path = "../context" }
wns-story = { path = "../story" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zip = { version = "=8.6.0", default-features = false }

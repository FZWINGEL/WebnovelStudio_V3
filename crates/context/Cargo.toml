[package]
name = "wns-context"
version.workspace = true
edition = "2024"
description = "L2: deterministic packet compilation, eligibility, lookup and receipts."

[dependencies]
wns-kernel = { path = "../kernel" }
wns-storage = { path = "../storage" }
wns-documents = { path = "../documents" }
wns-providers = { path = "../providers" }
# The frozen half of guidance reads and writes its own tables at a snapshot.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
unicode-segmentation = "=1.13.3"
